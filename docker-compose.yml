services:
  postgres:
    image: postgres:16-alpine
    container_name: videogames-postgres
    environment:
      - POSTGRES_DB=videogames
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SecurePass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - videogames-network

  backend:
    build:
      context: .
      dockerfile: VideoGamesCatalogue.Server/Dockerfile
    container_name: videogames-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=https://+:443;http://+:80
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https-dev-cert.pfx
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Password123!
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=videogames;Username=postgres;Password=SecurePass123
    ports:
      - "55027:443"
    depends_on:
      - postgres
    networks:
      - videogames-network

  frontend:
    build:
      context: ./videogamescatalogue.client
      dockerfile: Dockerfile
    container_name: videogames-frontend
    environment:
      - VITE_API_URL=https://localhost:55027/api
    ports:
      - "55028:5173"
    depends_on:
      - backend
    networks:
      - videogames-network

volumes:
  postgres_data:
    driver: local

networks:
  videogames-network:
    driver: bridge